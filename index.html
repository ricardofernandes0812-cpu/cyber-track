m:1px solid #2454b4;padding:9px;text-align:left;vertical-align:top}th{color:var(--cyan);background:#061758} .tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 7px;border-radius:20px;background:#1245aa;font-size:11px}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:#ff7b85}.hidden{display:none!important}.login{max-width:420px;margin:9vh auto;padding:22px}.floor{display:grid;grid-template-columns:repeat(5,minmax(45px,1fr));gap:7px}.desk{padding:9px 2px;border:1px solid #67c9ff;background:#0c3d9a;border-radius:4px;text-align:center;font-size:11px;cursor:pointer}.desk.in{background:#1e6e2d;border-color:#65ff76}.desk.out{background:#783044;border-color:#ff7d8a}.alertitem{padding:9px;border-bottom:1px solid #244b9c}.foot{font-size:11px;color:#8dbbff;text-align:center;padding:12px}@media(max-width:650px){.shell{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,1fr);border-right:0;border-bottom:1px solid #1c7dff}nav button{font-size:11px;padding:8px}.main{padding:10px}h1{font-size:19px}.login{margin:4vh 12px}.floor{grid-template-columns:repeat(4,minmax(40px,1fr))}}

</style></head><body><div id="loginView" class="login card"><h1 style="text-align:center">CYBER TRACK</h1><p style="text-align:center;color:var(--cyan)">RASTREAMENTO DE MALETAS DIDÁTICAS • SENAI</p><label>E-mail</label><input id="loginUser" autocomplete="username" placeholder="Usuário"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Senha"><button class="primary" style="width:100%;margin:12px 0" onclick="login()">Entrar</button><div id="loginMsg" class="bad"></div></div>
<div id="app" class="hidden"><header><div class="brand-row"><button id="mobileMenuBtn" class="menu-toggle" type="button" onclick="toggleMobileMenu()" aria-label="Abrir menu" aria-expanded="false">☰</button><div><h1>CYBER TRACK</h1><small>RASTREAMENTO RFID • SENAI</small></div></div><div class="header-actions"><button id="notificationBell" class="bell-btn" onclick="go('Notificações')" title="Notificações">🔔 <span id="bellCount" class="bell-count hidden"></span></button><span id="who"></span> <span id="clock"></span> <button onclick="logout()" class="danger">Sair</button></div></header><div class="shell"><div id="menuBackdrop" class="menu-backdrop" onclick="closeMobileMenu()"></div><nav id="nav"></nav><main class="main"><section id="page"></section><div class="foot">Cyber Track • Protótipo acadêmico • Dados sincronizados na nuvem • Supabase</div></main></div></div>
<script>
const $=id=>document.getElementById(id);let user=null,section='Painel inicial';const KEY='cybertrack_v1';let db={users:[],cases:[],events:[],alerts:[],settings:{room:'Sala de Automação',lateHours:4,requireAuth:true},notifications:[]};
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d)db={...db,...d}}catch(e){} if(!db.users.length)db.users=[{username:'admin',password:'Cyber123!',name:'Administrador',role:'Administrador',active:true}];save()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stamp(){return new Date().toLocaleString('pt-BR')}function id(){return 'MAL-'+String(Date.now()).slice(-6)}function currentRole(){return user?.role||'Consulta'}function isAdmin(){return currentRole()==='Administrador'}
function login(){let u=$('loginUser').value.trim(),p=$('loginPass').value;let found=db.users.find(x=>x.username===u&&x.password===p&&x.active!==false);if(!found){$('loginMsg').textContent='Usuário ou senha inválidos.';return}user=found;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Bem-vindo, '+found.name+'!';renderNav();go('Painel inicial');tick();setInterval(tick,1000)}function logout(){user=null;$('app').classList.add('hidden');$('loginView').classList.remove('hidden');$('loginPass').value=''}function tick(){$('clock').textContent=new Date().toLocaleTimeString('pt-BR')}
const modules=['Painel inicial','Acessos','Movimentações','Cadastro de maletas','Nova maleta','Alertas','Relatórios','Visualização do PDF','Configurações','Leitor RFID','Histórico individual','Detalhes da maleta','Notificações'];function renderNav(){$('nav').innerHTML=modules.map(m=>`<button onclick="go('${m}')">${m.toUpperCase()}</button>`).join('')}
function go(s){section=s;const p=$('page');if(!user)return;let canEdit=isAdmin()||currentRole()==='Operador';let html='';switch(s){case'Painel inicial':html=dashboard();break;case'Acessos':html=accessPage();break;case'Movimentações':html=eventsPage();break;case'Cadastro de maletas':html=casesPage();break;case'Nova maleta':html=caseForm();break;case'Alertas':html=alertsPage();break;case'Relatórios':html=reportsPage();break;case'Visualização do PDF':html=pdfPage();break;case'Configurações':html=settingsPage();break;case'Leitor RFID':html=readerPage();break;case'Histórico individual':html=individualPage();break;case'Detalhes da maleta':html=detailsPage();break;case'Notificações':html=notificationsPage();break;}p.innerHTML=html}
function dashboard(){let inside=db.cases.filter(c=>c.status==='Dentro').length,outside=db.cases.filter(c=>c.status==='Fora').length,latest=db.events[0];return `<h2 class="title">PAINEL INICIAL — VISÃO GERAL</h2><div class="grid"><div class="card">Maletas cadastradas<div class="metric">${db.cases.length}</div></div><div class="card">Dentro da sala<div class="metric ok">${inside}</div></div><div class="card">Fora da sala<div class="metric warn">${outside}</div></div><div class="card">Alertas ativos<div class="metric ${db.alerts.length?'bad':'ok'}">${db.alerts.filter(a=>!a.closed).length}</div></div></div><div class="card"><h3 class="title">Planta esquemática da sala</h3><p class="muted">Verde = registrada dentro • Vermelho = registrada fora. A planta é demonstrativa; a localização depende do registro de leitura/movimentação.</p><div class="floor">${Array.from({length:20},(_,i)=>{let c=db.cases[i];return `<div class="desk ${c?(c.status==='Dentro'?'in':'out'):''}" onclick="${c?`showCase('${c.id}')`:'go(\'Cadastro de maletas\')'}">${c?esc(c.code):'Mesa '+(i+1)}<br>${c?esc(c.name):'sem maleta'}</div>`}).join('')}</div></div><div class="card"><h3 class="title">Última movimentação</h3>${latest?`<b>${esc(latest.type)}</b> — ${esc(latest.code)} (${esc(latest.name)})<br><span class="muted">${esc(latest.time)} • Responsável: ${esc(latest.responsible||'—')} • ${esc(latest.location||'')}</span>`:'Nenhuma movimentação registrada.'}</div><div class="card"><button class="primary" onclick="go('Nova maleta')">+ Nova maleta</button><button onclick="go('Leitor RFID')">Abrir leitor RFID</button><button onclick="go('Relatórios')">Gerar relatório</button></div>`}
function accessPage(){return `<h2 class="title">ACESSOS — USUÁRIOS E PERMISSÕES</h2>${!isAdmin()?'<p class="warn">Somente Administrador pode gerenciar usuários.</p>':''}<div class="card"><form onsubmit="addUser(event)"><div class="row"><div><label>Nome</label><input id="un" required></div><div><label>E-mail</label><input id="uu" required></div><div><label>Senha</label><input id="up" required minlength="6"></div><div><label>Perfil</label><select id="ur"><option>Consulta</option><option>Operador</option><option>Administrador</option></select></div></div><button class="primary" ${!isAdmin()?'disabled':''}>Cadastrar usuário</button></form></div><div class="card tablewrap"><table><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>${db.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'Ativo':'Bloqueado'}</td><td><button onclick="toggleUser(${i})" ${!isAdmin()||u.username==='admin'?'disabled':''}>${u.active?'Bloquear':'Ativar'}</button></td></tr>`).join('')}</table></div><p class="muted">Protótipo acadêmico: credenciais ficam no armazenamento local do dispositivo; não é um sistema seguro para produção.</p>`}
function addUser(e){e.preventDefault();if(!isAdmin())return;let username=$('uu').value.trim();if(db.users.some(u=>u.username===username)){alert('Esse usuário já existe.');return}db.users.push({name:$('un').value.trim(),username,password:$('up').value,role:$('ur').value,active:true});save();notify('Usuário cadastrado: '+username);go('Acessos')}function toggleUser(i){if(!isAdmin())return;db.users[i].active=!db.users[i].active;save();go('Acessos')}
function casesPage(){return `<h2 class="title">CADASTRO DE MALETAS</h2><div class="card"><button class="primary" onclick="go('Nova maleta')">+ Nova maleta</button><div class="row"><div><label>Buscar</label><input id="caseSearch" placeholder="Código, nome ou RFID" oninput="filterCases()"></div><div><label>Status</label><select id="caseStatus" onchange="filterCases()"><option value="">Todos</option><option>Dentro</option><option>Fora</option><option>Manutenção</option></select></div></div></div><div class="card tablewrap"><table id="caseTable"><thead><tr><th>Código</th><th>Maleta</th><th>RFID</th><th>Status</th><th>Local</th><th>Ações</th></tr></thead><tbody>${caseRows(db.cases)}</tbody></table></div>`}function caseRows(arr){return arr.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.rfid)}</td><td><span class="pill">${esc(c.status)}</span></td><td>${esc(c.location||'—')}</td><td><button onclick="showCase('${c.id}')">Detalhes</button> <button onclick="individualFor('${c.id}')">Histórico</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma maleta cadastrada.</td></tr>'}function filterCases(){let q=($('caseSearch')?.value||'').toLowerCase(),st=$('caseStatus')?.value||'';let a=db.cases.filter(c=>(c.code+c.name+c.rfid).toLowerCase().includes(q)&&(!st||c.status===st));$('caseTable').querySelector('tbody').innerHTML=caseRows(a)}
function caseForm(){return `<h2 class="title">NOVA MALETA</h2><div class="card"><form onsubmit="saveCase(event)"><div class="row"><div><label>Código interno</label><input id="nc" placeholder="Ex.: MAL-001" required></div><div><label>Nome/descrição</label><input id="nn" placeholder="Maleta didática CLP" required></div><div><label>Código RFID (único)</label><input id="nr" placeholder="Ler etiqueta ou digitar código" required></div><div><label>Local registrado</label><input id="nl" placeholder="Ex.: Sala de Automação"></div><div><label>Status inicial</label><select id="ns"><option>Dentro</option><option>Fora</option><option>Manutenção</option></select></div><div><label>Responsável</label><input id="nresp" value="${esc(user.name)}" required></div></div><label>Observações</label><textarea id="nobs"></textarea><button class="primary">Salvar maleta</button><button type="button" onclick="go('Cadastro de maletas')">Cancelar</button></form></div>`}function saveCase(e){e.preventDefault();let code=$('nc').value.trim(),rfid=$('nr').value.trim();if(db.cases.some(c=>c.code===code||c.rfid===rfid)){alert('Código interno ou RFID já cadastrado.');return}let c={id:'c'+Date.now(),code,name:$('nn').value.trim(),rfid,location:$('nl').value.trim(),status:$('ns').value,responsible:$('nresp').value.trim(),notes:$('nobs').value,created:stamp(),last:stamp()};db.cases.push(c);save();notify('Nova maleta cadastrada: '+code);recordEvent('Cadastro',c,c.responsible);go('Cadastro de maletas')}
function recordEvent(type,c,responsible,location){let ev={id:'e'+Date.now(),type,caseId:c.id,code:c.code,name:c.name,rfid:c.rfid,time:stamp(),responsible:responsible||user.name,location:location||c.location||''};db.events.unshift(ev);c.last=ev.time;save();}function move(type){let rfid=$('moveRFID').value.trim(),c=db.cases.find(x=>x.rfid===rfid||x.code===rfid);if(!c){alert('RFID/código não cadastrado. Cadastre a maleta antes de movimentar.');return}let loc=$('moveLocal').value.trim()|| (type==='Entrada'?db.settings.room:'Fora da sala'),resp=$('moveResp').value.trim()||user.name;if(type==='Entrada')c.status='Dentro';else c.status='Fora';c.location=loc;c.responsible=resp;recordEvent(type,c,resp,loc);if(type==='Saída'&&db.settings.requireAuth){db.alerts.unshift({id:'a'+Date.now(),type:'Saída registrada — conferir autorização',code:c.code,time:stamp(),detail:'Registro gerado para conferência; o sistema não detecta autorização automaticamente.',closed:false});notify('Saída registrada: '+c.code)}else notify(type+' registrada: '+c.code);save();go('Movimentações')}
function eventsPage(){return `<h2 class="title">MOVIMENTAÇÕES — ENTRADAS E SAÍDAS</h2><div class="card"><div class="row"><div><label>RFID / código da maleta</label><input id="moveRFID" placeholder="Passe o leitor externo aqui" autofocus></div><div><label>Local</label><input id="moveLocal" placeholder="${esc(db.settings.room)}"></div><div><label>Responsável</label><input id="moveResp" value="${esc(user.name)}"></div></div><button class="primary" onclick="move('Entrada')">REGISTRAR ENTRADA</button><button class="light" onclick="move('Saída')">REGISTRAR SAÍDA</button><p class="muted">Leitores que funcionam como teclado podem preencher o campo RFID. Bluetooth/serial precisa de integração específica do modelo.</p></div><div class="card tablewrap"><table><tr><th>Data/hora</th><th>Tipo</th><th>Maleta</th><th>RFID</th><th>Local</th><th>Responsável</th></tr>${eventRows(db.events)}</table></div>`}function eventRows(arr){return arr.map(e=>`<tr><td>${esc(e.time)}</td><td>${esc(e.type)}</td><td>${esc(e.code)} — ${esc(e.name)}</td><td>${esc(e.rfid)}</td><td>${esc(e.location)}</td><td>${esc(e.responsible)}</td></tr>`).join('')||'<tr><td colspan="6">Sem movimentações.</td></tr>'}
function alertsPage(){return `<h2 class="title">ALERTAS</h2><div class="card"><p class="muted">Alertas automáticos confiáveis dependem das regras e da infraestrutura definidas. Neste protótipo, saídas são listadas para conferência e atrasos podem ser identificados pelo relatório.</p>${db.alerts.map((a,i)=>`<div class="alertitem"><b class="${a.closed?'ok':'bad'}">${a.closed?'RESOLVIDO':'ATIVO'} — ${esc(a.type)}</b><br>${esc(a.code)} • ${esc(a.time)}<p>${esc(a.detail||'')}</p><button onclick="closeAlert(${i})" ${a.closed?'disabled':''}>Marcar conferido</button></div>`).join('')||'Nenhum alerta registrado.'}</div>`}function closeAlert(i){db.alerts[i].closed=true;save();notify('Alerta conferido: '+db.alerts[i].code);go('Alertas')}
function reportsPage(){return `<h2 class="title">RELATÓRIOS</h2><div class="card"><div class="row"><div><label>Data inicial</label><input type="date" id="from"></div><div><label>Data final</label><input type="date" id="to"></div><div><label>Maleta</label><select id="filterCase"><option value="">Todas</option>${db.cases.map(c=>`<option value="${esc(c.id)}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select></div><div><label>Responsável</label><input id="filterResp" placeholder="Todos"></div></div><button class="primary" onclick="makeReport()">Aplicar filtros</button><button onclick="exportCSV()">Exportar CSV</button></div><div id="reportResult" class="card">Defina os filtros e aplique para visualizar os registros.</div>`}let reportData=[];function makeReport(){let f=$('from').value,t=$('to').value,ci=$('filterCase').value,r=$('filterResp').value.toLowerCase();reportData=db.events.filter(e=>{let d=e.time.split(' ')[0].split('/').reverse().join('-');return(!f||d>=f)&&(!t||d<=t)&&(!ci||e.caseId===ci)&&(!r||e.responsible.toLowerCase().includes(r))});$('reportResult').innerHTML=`<h3>Resultado: ${reportData.length} registros</h3><div class="tablewrap"><table><tr><th>Data/hora</th><th>Tipo</th><th>Maleta</th><th>RFID</th><th>Responsável</th></tr>${reportData.map(e=>`<tr><td>${esc(e.time)}</td><td>${esc(e.type)}</td><td>${esc(e.code)} — ${esc(e.name)}</td><td>${esc(e.rfid)}</td><td>${esc(e.responsible)}</td></tr>`).join('')}</table></div><button class="primary" onclick="go('Visualização do PDF')">Visualizar relatório / imprimir</button>`}function exportCSV(){let arr=reportData.length?reportData:db.events;let csv='Data/hora;Tipo;Código;Nome;RFID;Local;Responsável\n'+arr.map(e=>[e.time,e.type,e.code,e.name,e.rfid,e.location,e.responsible].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\n');download('cybertrack_relatorio.csv','text/csv;charset=utf-8;\ufeff'+csv)}function pdfPage(){let arr=reportData.length?reportData:db.events;return `<h2 class="title">VISUALIZAÇÃO DO RELATÓRIO</h2><div class="card"><h2>CYBER TRACK — Relatório de movimentações</h2><p>Gerado em ${stamp()} • Registros: ${arr.length}</p><div class="tablewrap"><table><tr><th>Data/hora</th><th>Tipo</th><th>Maleta</th><th>RFID</th><th>Local</th><th>Responsável</th></tr>${eventRows(arr)}</table></div><button class="primary" onclick="printReport()">Imprimir / salvar como PDF</button><button onclick="exportCSV()">Salvar CSV</button><p class="muted">A opção PDF depende do suporte de impressão do dispositivo/visualizador. Se não abrir, exporte CSV ou use o navegador para imprimir a página.</p></div>`}function printReport(){let arr=reportData.length?reportData:db.events;let w=window.open('','_blank');if(!w){alert('O visualizador bloqueou a nova janela. Use Exportar CSV ou abra o projeto num navegador com impressão habilitada.');return}w.document.write('<html><head><title>Relatório Cyber Track</title><style>body{font-family:Arial;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:6px;text-align:left;font-size:11px}h1{color:#123}</style></head><body><h1>CYBER TRACK</h1><p>Relatório de movimentações — '+stamp()+'</p><table><tr><th>Data/hora</th><th>Tipo</th><th>Maleta</th><th>RFID</th><th>Local</th><th>Responsável</th></tr>'+arr.map(e=>'<tr>'+[e.time,e.type,e.code+' - '+e.name,e.rfid,e.location,e.responsible].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()}
function settingsPage(){return `<h2 class="title">CONFIGURAÇÕES</h2><div class="card"><form onsubmit="saveSettings(event)"><label>Nome do local principal</label><input id="room" value="${esc(db.settings.room)}" required><label>Limite de atraso (horas) — para referência em relatórios</label><input id="late" type="number" min="1" value="${Number(db.settings.lateHours)||4}" required><label><input id="auth" type="checkbox" style="width:auto" ${db.settings.requireAuth?'checked':''}> Gerar alerta de conferência para cada saída</label><button class="primary">Salvar configurações</button></form><hr><button class="danger" onclick="backupData()">Exportar backup JSON</button><button onclick="restorePick.click()">Importar backup JSON</button><input id="restorePick" type="file" accept="application/json" class="hidden" onchange="restoreData(event)"><p class="muted">Dados armazenados localmente no dispositivo. Faça backups periódicos.</p></div>`}function saveSettings(e){e.preventDefault();db.settings.room=$('room').value.trim();db.settings.lateHours=Number($('late').value);db.settings.requireAuth=$('auth').checked;save();notify('Configurações atualizadas');go('Configurações')}
function readerPage(){return `<h2 class="title">LEITOR RFID</h2><div class="card"><p>Estado: <b class="warn">aguardando configuração do modelo</b></p><p class="muted">Esta tela aceita leitores externos que digitam o identificador no campo (USB/OTG ou Bluetooth HID/teclado). Leitores Bluetooth serial, USB com protocolo proprietário ou UHF com SDK exigem integração específica.</p><label>Teste de leitura RFID</label><input id="testRFID" placeholder="Aproxime a etiqueta do leitor; o código deve aparecer aqui" autofocus><button class="primary" onclick="lookupRFID()">Consultar código</button><div id="readerResult"></div><hr><p class="muted">O app não detecta automaticamente a conexão física. O estado real do leitor só poderá ser exibido após conhecermos marca, modelo e protocolo.</p></div>`}function lookupRFID(){let x=$('testRFID').value.trim(),c=db.cases.find(c=>c.rfid===x||c.code===x);$('readerResult').innerHTML=c?`<p class="ok">Etiqueta reconhecida: <b>${esc(c.code)} — ${esc(c.name)}</b></p><p>Status: ${esc(c.status)} • Local: ${esc(c.location)}</p><button onclick="showCase('${c.id}')">Ver detalhes</button><button onclick="prefillMove('${esc(c.rfid)}')">Registrar movimentação</button>`:'<p class="bad">Código não cadastrado. Verifique a etiqueta ou cadastre uma nova maleta.</p>'}function prefillMove(r){go('Movimentações');setTimeout(()=>$('moveRFID').value=r,20)}
function individualPage(){return `<h2 class="title">HISTÓRICO INDIVIDUAL</h2><div class="card"><label>Selecione a maleta</label><select id="indCase"><option value="">Selecione...</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select><button class="primary" onclick="showIndividual()">Consultar histórico</button><div id="individualResult"></div></div>`}function individualFor(cid){go('Histórico individual');setTimeout(()=>{$('indCase').value=cid;showIndividual()},20)}function showIndividual(){let c=db.cases.find(c=>c.id===$('indCase').value);$('individualResult').innerHTML=c?`<h3>${esc(c.code)} — ${esc(c.name)}</h3><div class="tablewrap"><table><tr><th>Data/hora</th><th>Evento</th><th>Local</th><th>Responsável</th></tr>${db.events.filter(e=>e.caseId===c.id).map(e=>`<tr><td>${esc(e.time)}</td><td>${esc(e.type)}</td><td>${esc(e.location)}</td><td>${esc(e.responsible)}</td></tr>`).join('')||'<tr><td colspan="4">Sem histórico.</td></tr>'}</table></div>`:''}
function detailsPage(){return `<h2 class="title">DETALHES DA MALETA</h2><div class="card"><label>Selecione a maleta</label><select id="detailCase"><option value="">Selecione...</option>${db.cases.map(c=>`<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select><button class="primary" onclick="showDetails()">Exibir detalhes</button><div id="detailResult"></div></div>`}function showCase(cid){go('Detalhes da maleta');setTimeout(()=>{$('detailCase').value=cid;showDetails()},20)}function showDetails(){let c=db.cases.find(c=>c.id===$('detailCase').value);$('detailResult').innerHTML=c?`<h3>${esc(c.code)} — ${esc(c.name)}</h3><p><b>RFID:</b> ${esc(c.rfid)}</p><p><b>Status:</b> ${esc(c.status)}</p><p><b>Local:</b> ${esc(c.location||'Não informado')}</p><p><b>Responsável:</b> ${esc(c.responsible||'—')}</p><p><b>Cadastro:</b> ${esc(c.created)}</p><p><b>Última movimentação:</b> ${esc(c.last||'—')}</p><p><b>Observações:</b> ${esc(c.notes||'—')}</p><button onclick="individualFor('${c.id}')">Ver histórico</button>`:''}
function notificationsPage(){return `<h2 class="title">NOTIFICAÇÕES</h2><div class="card">${db.notifications.map(n=>`<div class="alertitem"><b>${esc(n.time)}</b><br>${esc(n.message)}</div>`).join('')||'Nenhuma notificação.'}<button onclick="db.notifications=[];save();go('Notificações')">Limpar notificações</button></div>`}function notify(message){db.notifications.unshift({time:stamp(),message});db.notifications=db.notifications.slice(0,200);save()}function download(name,typecontent){let blob=new Blob([typecontent],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backupData(){download('cybertrack_backup.json','application/json;charset=utf-8;'+JSON.stringify(db,null,2))}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.users||!d.cases||!d.events)throw Error();db=d;save();alert('Backup importado.');go('Painel inicial')}catch(err){alert('Arquivo de backup inválido.')}};r.readAsText(f)}

const oldLogin=login;
login=function(){oldLogin();if(user){db.accessLog.unshift({time:stamp(),username:user.username,action:'Login'});save()}};

function normUID(v){return String(v||'').toUpperCase().replace(/[^A-F0-9]/g,'')}
function passUID(raw,source='Simulação',when=null){
 let uid=normUID(raw);if(!uid){alert('Informe um UID válido.');return}
 let c=db.cases.find(x=>normUID(x.rfid)===uid);
 if(!c){db.alerts.unshift({id:'a'+Date.now(),type:'Etiqueta não cadastrada',code:uid,time:stamp(),detail:'Leitura recebida de '+source,closed:false});notify('RFID desconhecido: '+uid);save();if(section==='Movimentações')go(section);return}
 let ev={id:'e'+Date.now()+'-'+Math.random().toString(36).slice(2,6),type:'Passagem RFID',caseId:c.id,code:c.code,name:c.name,rfid:uid,time:when||stamp(),responsible:'Leitor RFID',location:db.settings.room,source};
 db.events.unshift(ev);c.last=ev.time;notify('Passagem registrada: '+c.code);save();if(section==='Movimentações'||section==='Painel inicial')go(section);
}
const oldSaveCase=saveCase;

eventsPage=function(){return `<h2 class="title">MOVIMENTAÇÕES — PASSAGENS RFID</h2><div class="card"><p class="muted">Um único leitor registra passagens, sem inferir entrada ou saída.</p><label>UID para simular leitura</label><input id="simulateUID" placeholder="Digite o UID cadastrado"><button class="primary" onclick="passUID($('simulateUID').value)">Simular leitura</button><p id="bridgeStatus" class="muted">Integração: configure o endereço do notebook em Configurações.</p></div><div class="card tablewrap"><table><tr><th>Data/hora</th><th>Evento</th><th>Maleta</th><th>RFID</th><th>Origem</th></tr>${db.events.filter(e=>e.type==='Passagem RFID').map(e=>`<tr><td>${esc(e.time)}</td><td>Passagem</td><td>${esc(e.code)}</td><td>${esc(e.rfid)}</td><td>${esc(e.source||'RFID')}</td></tr>`).join('')||'<tr><td colspan="5">Nenhuma passagem registrada.</td></tr>'}</table></div>`};

function roomState(c){

 if(st==='dentro')return {kind:'inside',label:'Dentro da sala'};

}

 return `<div class="room-status"><div class="room-status-head"><strong>${tag.label}</strong><span class="pill"><span class="room-dot ${state.kind}"></span>${state.label}</span></div><div class="room-small">${c?esc(c.name):'UID ainda não cadastrado'} · RFID ${tag.uid}</div><div class="room-small">Entradas: <b>${entry}</b> &nbsp; Saídas: <b>${exit}</b></div><div class="room-small">Última movimentação: ${last?esc(last.type)+' — '+esc(last.time):'Nenhuma registrada'}</div></div>`;
}

}

function reportHTML(){const entry=filteredReport.filter(e=>e.type==='Entrada').length,exit=filteredReport.filter(e=>e.type==='Saída').length;const name=reportFilters.maleta?(db.cases.find(c=>normUID(c.rfid)===reportFilters.maleta)?.name||reportFilters.maleta):'Todas as maletas';return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório Cyber Track</title><style>body{font:13px Arial,sans-serif;color:#17223a;margin:30px}h1{color:#123e8a}h2{font-size:16px}p{line-height:1.6}.summary{padding:12px;background:#eef4fb;border-radius:6px}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{padding:9px 7px;border-bottom:1px solid #cdd8e8;text-align:left}th{background:#153b76;color:white}@page{size:A4 landscape;margin:14mm}</style></head><body><h1>CYBER TRACK</h1><h2>Relatório de movimentações RFID</h2><p>Emitido em ${esc(stamp())}</p><div class="summary"><b>Maleta:</b> ${esc(name)} &nbsp; <b>Período:</b> ${esc(reportFilters.from||'Início')} até ${esc(reportFilters.to||'Hoje')}<br><b>Movimentações:</b> ${filteredReport.length} &nbsp; <b>Entradas:</b> ${entry} &nbsp; <b>Saídas:</b> ${exit}</div><table><thead><tr><th>Data/hora</th><th>Movimentação</th><th>Maleta</th><th>RFID</th><th>Origem</th></tr></thead><tbody>${filteredReport.map(e=>`<tr><td>${esc(e.time)}</td><td>${esc(e.type)}</td><td>${esc(e.code)} — ${esc(e.name)}</td><td>${esc(e.rfid)}</td><td>${esc(e.source)}</td></tr>`).join('')}</tbody></table></body></html>`;}
printCurrentReport=function(){filteredReport=db.events.filter(e=>(e.type==='Entrada'||e.type==='Saída')&&eventInFilter(e));const w=window.open('','_blank');if(!w){alert('Permita a abertura de pop-ups para gerar o PDF.');return;}w.document.write(reportHTML());w.document.close();w.focus();setTimeout(()=>w.print(),350);};
function exportFilteredCSV(){filteredReport=db.events.filter(e=>(e.type==='Entrada'||e.type==='Saída')&&eventInFilter(e));const rows=[['Data/hora','Movimentação','Maleta','UID RFID','Origem'],...filteredReport.map(e=>[e.time,e.type,e.code+' — '+e.name,e.rfid,e.source])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cybertrack_movimentacoes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

let ctLastSeen=0;
function ctNotifications(){return db.events.filter(e=>e.type==='Entrada'||e.type==='Saída').map(e=>({id:e.id,time:e.time,title:`${e.type==='Entrada'?'Entrada':'Saída'} — ${e.code||e.name}`,description:`${e.name||e.code} ${e.type==='Entrada'?'entrou na sala':'saiu da sala'} · RFID ${e.rfid||'—'}`,type:e.type}));}
notificationsPage=function(){const items=ctNotifications();return `<h2 class="title">NOTIFICAÇÕES</h2><div class="card"><p class="muted">Acontecimentos registrados pelo leitor RFID e sincronizados com a nuvem.</p><button onclick="syncCloud(false).then(()=>go('Notificações'))">Atualizar notificações</button><div style="margin-top:14px">${items.length?items.map(n=>`<div class="notice"><span class="notice-time">${esc(n.time)}</span><strong><span class="notice-icon ${n.type==='Entrada'?'ok':'bad'}">●</span>${esc(n.title)}</strong><small>${esc(n.description)}</small></div>`).join(''):'<p class="muted">Nenhuma movimentação registrada ainda.</p>'}</div><p class="muted">Notificações de novos usuários exigem um registro de auditoria no Supabase, ainda não configurado.</p></div>`;};
function updateNotificationBadge(markSeen=false){const count=ctNotifications().length;if(markSeen)ctLastSeen=count;const badge=document.getElementById('bellCount');if(!badge)return;const unread=Math.max(0,count-ctLastSeen);badge.textContent=unread>99?'99+':String(unread);badge.classList.toggle('hidden',unread===0);}
const ctSyncOriginal=syncCloud;
syncCloud=async function(refresh=true){await ctSyncOriginal(refresh&&section!=='Relatórios'&&section!=='Configurações');if(section==='Relatórios')renderFilteredReport();if(section==='Notificações'&&refresh)go('Notificações');updateNotificationBadge();};
const ctStartOriginal=startCloud;
startCloud=async function(u){await ctStartOriginal(u);ctLastSeen=ctNotifications().length;updateNotificationBadge();};
</script>
<script>
/* V4: controles administrativos. A autorização efetiva depende das políticas RLS e da Edge Function. */
let ctProfile=null,ctUsers=[];
async function ctLoadProfile(){
 const {data:{user:authUser}}=await cloud.auth.getUser();
 if(!authUser){ctProfile=null;return}
 const {data,error}=await cloud.from('perfis').select('id,nome,perfil,ativo').eq('id',authUser.id).maybeSingle();
 if(error){console.warn('Perfis não configurados:',error.message);ctProfile=null;user.role='Consulta';return}
 ctProfile=data;user.role=data?.ativo&&data?.perfil==='administrador'?'Administrador':'Consulta';
 user.name=data?.nome||authUser.email.split('@')[0];$('who').textContent='Bem-vindo, '+user.name+'!';
}
const ctStartV3=startCloud;
startCloud=async function(u){await ctStartV3(u);await ctLoadProfile();renderNav();go('Painel inicial')};
const ctOldNav=renderNav;
renderNav=function(){ctOldNav();};
function ctRequireAdmin(){if(!ctProfile||ctProfile.perfil!=='administrador'||!ctProfile.ativo){alert('Apenas o administrador pode realizar esta ação.');return false}return true}
function ctEditForm(id){if(!ctRequireAdmin())return;let c=db.cases.find(x=>x.id===String(id));if(!c)return;
 $('page').innerHTML=`<h2 class="title">EDITAR MALETA — ${esc(c.code)}</h2><div class="card"><form onsubmit="ctSaveEdit(event,'${esc(c.id)}')"><div class="row"><div><label>Código interno</label><input id="edCode" required value="${esc(c.code)}"></div><div><label>Nome</label><input id="edName" required value="${esc(c.name)}"></div><div><label>UID RFID</label><input id="edUid" required value="${esc(c.rfid)}"></div><div><label>Local</label><input id="edLoc" value="${esc(c.location)}"></div></div><label>Responsável</label><input id="edResp" value="${esc(c.responsible)}"><label>Observações</label><textarea id="edNotes">${esc(c.notes)}</textarea><div class="filter-actions"><button class="primary">Salvar alterações</button><button type="button" onclick="go('Cadastro de maletas')">Cancelar</button></div></form></div>`;
}
async function ctSaveEdit(e,id){e.preventDefault();if(!ctRequireAdmin())return;let uid=normUID($('edUid').value),codigo=$('edCode').value.trim();if(uid.length<4)return alert('UID inválido');if(db.cases.some(c=>c.id!==id&&(normUID(c.rfid)===uid||c.code===codigo)))return alert('Código ou UID já cadastrado');
 const {error}=await cloud.from('maletas').update({codigo,nome:$('edName').value.trim(),uid_rfid:uid,localizacao:$('edLoc').value.trim(),responsavel:$('edResp').value.trim(),observacoes:$('edNotes').value}).eq('id',id);if(error)return cloudErr(error);await syncCloud(false);go('Cadastro de maletas');alert('Maleta atualizada.');}
async function ctToggleCase(id){if(!ctRequireAdmin())return;const c=db.cases.find(x=>x.id===String(id));if(!c)return;const isOff=c.status==='Manutenção';const next=isOff?'dentro':'manutencao';if(!confirm(`${isOff?'Reativar':'Desativar'} ${c.code}? ${isOff?'O status passará a Dentro.':'O status passará a Manutenção.'}`))return;const {error}=await cloud.from('maletas').update({status:next}).eq('id',id);if(error)return cloudErr(error);await syncCloud(false);go('Cadastro de maletas');}
async function ctDeleteCase(id){if(!ctRequireAdmin())return;const c=db.cases.find(x=>x.id===String(id));if(!c)return;if(!confirm(`Excluir definitivamente ${c.code}? O histórico poderá impedir a exclusão. Prefira desativar.`))return;const {error}=await cloud.from('maletas').delete().eq('id',id);if(error)return cloudErr(error);await syncCloud(false);go('Cadastro de maletas');}
caseRows=function(arr){return arr.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}</td><td>${esc(c.rfid)}</td><td><span class="pill">${esc(c.status)}</span></td><td>${esc(c.location||'—')}</td><td><button onclick="showCase('${c.id}')">Detalhes</button> <button onclick="individualFor('${c.id}')">Histórico</button> ${isAdmin()?`<button onclick="ctEditForm('${c.id}')">Editar</button> <button onclick="ctToggleCase('${c.id}')">${c.status==='Manutenção'?'Reativar':'Desativar'}</button> <button class="danger" onclick="ctDeleteCase('${c.id}')">Excluir</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma maleta cadastrada.</td></tr>'};
casesPage=function(){return `<h2 class="title">CADASTRO DE MALETAS</h2><div class="card">${isAdmin()?'<button class="primary" onclick="go(\'Nova maleta\')">+ Nova maleta</button>':'<p class="muted">Consulta de maletas — alterações disponíveis somente para administradores.</p>'}<div class="row"><div><label>Buscar</label><input id="caseSearch" placeholder="Código, nome ou RFID" oninput="filterCases()"></div><div><label>Status</label><select id="caseStatus" onchange="filterCases()"><option value="">Todos</option><option>Dentro</option><option>Fora</option><option>Manutenção</option></select></div></div></div><div class="card tablewrap"><table id="caseTable"><thead><tr><th>Código</th><th>Maleta</th><th>RFID</th><th>Status</th><th>Local</th><th>Ações</th></tr></thead><tbody>${caseRows(db.cases)}</tbody></table></div>`};
const ctOldSaveCase=saveCase;
saveCase=async function(e){if(!ctRequireAdmin()){e.preventDefault();return}return ctOldSaveCase(e)};
const ctOldGoV4=go;
go=function(s){if(s==='Nova maleta'&&!isAdmin())return alert('Somente administrador.');ctOldGoV4(s)};
async function ctChangePassword(e){e.preventDefault();const pw=$('ctPw').value,confirmPw=$('ctPw2').value;if(pw.length<8||pw!==confirmPw)return alert('As senhas devem coincidir e ter pelo menos 8 caracteres.');const {error}=await cloud.auth.updateUser({password:pw});if(error)return cloudErr(error);alert('Senha alterada com sucesso.');go('Configurações')}
async function ctAdminRequest(action,payload={}){if(!ctRequireAdmin())return null;const {data,error}=await cloud.functions.invoke('gerenciar-usuarios',{body:{action,...payload}});if(error){cloudErr(error);return null}if(data?.error){alert(data.error);return null}return data}
async function ctListUsers(){const data=await ctAdminRequest('list');if(!data)return;ctUsers=data.users||[];ctRenderUsers()}
function ctRenderUsers(){let el=$('ctUsers');if(!el)return;el.innerHTML=`<div class="tablewrap"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>${ctUsers.map(u=>`<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email||'—')}</td><td>${esc(u.perfil)}</td><td>${u.ativo?'Ativo':'Desativado'}</td><td><button onclick="ctToggleUser('${u.id}',${!u.ativo})" ${u.id===ctProfile?.id?'disabled':''}>${u.ativo?'Desativar':'Reativar'}</button></td></tr>`).join('')}</table></div>`}
async function ctToggleUser(id,ativo){if(!confirm(`${ativo?'Reativar':'Desativar'} usuário?`))return;const data=await ctAdminRequest('toggle',{id,ativo});if(data)ctListUsers()}
async function ctCreateUser(e){e.preventDefault();if(!ctRequireAdmin())return;const pw=$('ctUserPw').value;if(pw!==$('ctUserPw2').value)return alert('Senhas diferentes.');if(pw.length<8)return alert('Senha mínima: 8 caracteres.');const data=await ctAdminRequest('create',{nome:$('ctUserName').value.trim(),email:$('ctUserEmail').value.trim(),password:pw,perfil:$('ctUserRole').value});if(data){alert('Usuário cadastrado.');go('Configurações');ctListUsers()}}
settingsPage=function(){return `<h2 class="title">CONFIGURAÇÕES</h2><div class="card"><h3>Minha conta</h3><p class="muted">Perfil: ${esc(isAdmin()?'Administrador':'Consulta')} · Autenticação Supabase</p><form onsubmit="ctChangePassword(event)"><div class="row"><div><label>Nova senha</label><input id="ctPw" type="password" minlength="8" autocomplete="new-password" required></div><div><label>Confirmar nova senha</label><input id="ctPw2" type="password" minlength="8" autocomplete="new-password" required></div></div><button class="primary">Alterar minha senha</button></form></div><div class="card"><h3>Sincronização</h3><p id="cloudStatus" class="ok">Supabase conectado</p><button onclick="syncCloud()">Atualizar dados</button></div>${isAdmin()?`<div class="card"><h3>Cadastrar usuário</h3><form onsubmit="ctCreateUser(event)"><div class="row"><div><label>Nome</label><input id="ctUserName" required></div><div><label>E-mail</label><input id="ctUserEmail" type="email" required></div><div><label>Senha</label><input id="ctUserPw" type="password" minlength="8" required></div><div><label>Confirmar senha</label><input id="ctUserPw2" type="password" minlength="8" required></div><div><label>Permissão</label><select id="ctUserRole"><option value="consulta">Usuário comum</option><option value="administrador">Administrador</option></select></div></div><button class="primary">Cadastrar usuário</button></form></div><div class="card"><h3>Gerenciar usuários</h3><button onclick="ctListUsers()">Carregar usuários</button><div id="ctUsers"></div><p class="muted">Requer a função segura gerenciar-usuarios instalada no Supabase.</p></div>`:''}`};
</script>
</body></html>
